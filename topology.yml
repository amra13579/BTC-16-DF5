# DF-5 "Disk Forensics" — single Windows 10 analyst workstation.
# The whole module (DF-5.1–5.4) is performed on this one host using the LMS tools
# NATIVELY on Windows: Registry Explorer, RegRipper, FTK Imager, Autopsy.
# Pure offline analysis — no target host, no Docker.
name: btcmp-16-disk-forensics-main
hosts:
  - name: dfvm                        # analyst workstation (visible to trainee)
    # c{cpu}_r{ramGB}_d{diskGB}. c4_r8_d60 — 8 GB (r8 proven by the full Windows CR
    # github.com/Panagiotis-INS/BTCM-16-ADV, host wvvm), d60. This flavor got dfvm past
    # the platform reachability gate once the image was moved to windows-10 (below), so
    # the earlier disk-size worry does not apply to this image.
    flavor: c4_r8_d60
    base_box:
      # windows-10-x86_64 — VERIFIED WORKING on this platform: it brings up the
      # WinRM/PSRP listener in time and passes the platform's reachability gate.
      # DO NOT revert to windows-11-x86_64: with that image the gate timed out (build of
      # 2026-09-12) — windows-11 did not raise a listener within the ~1600s window here,
      # windows-10 does. mgmt_user stays `windows`.
      image: windows-10-x86_64
      mgmt_user: windows
      # mgmt_protocol: winrm — REQUIRED. The platform injects the PSRP/WinRM-HTTPS
      # connection config (ansible_connection=psrp, cert_validation=ignore, port 5986)
      # for a host only when this is set. The full working Windows CR on this platform
      # (github.com/Panagiotis-INS/BTCM-16-ADV, host wvvm) sets it exactly like this.
      # (An earlier attempt removed this key on a wrong hypothesis; it did not fix the
      # timeout and is restored here.)
      mgmt_protocol: winrm
    hidden: false
routers:
  - name: router
    flavor: standard.small
    base_box:
      image: ubuntu-noble-x86_64
      mgmt_user: ubuntu
      mgmt_protocol: ssh
    hidden: false
networks:
  - name: network-2
    cidr: 192.168.0.0/24
    accessible_by_user: true
    hidden: false
wan:
  name: network-1
  cidr: 10.10.10.0/24
net_mappings:
  - host: dfvm
    network: network-2
    ip: 192.168.0.10
router_mappings:
  - router: router
    network: network-2
    ip: 192.168.0.1
groups: []
