# DF-5 "Disk Forensics" — single Windows 11 analyst workstation.
# The whole module (DF-5.1–5.4) is performed on this one host using the LMS tools
# NATIVELY on Windows: Registry Explorer, RegRipper, FTK Imager, Autopsy.
# Pure offline analysis — no target host, no Docker.
name: btcmp-16-disk-forensics-main
hosts:
  - name: dfvm                        # analyst workstation (visible to trainee)
    # c{cpu}_r{ramGB}_d{diskGB}. The proven baseline runs c4_r5_d80; we keep 8 GB
    # because Autopsy ingest over two E01s is tight at 5 GB. d80 is kept because the
    # baseline had to move from d50 -> d80 (Windows 11 image minimum disk).
    # ⚠ SME: if the stack fails to create, c4_r8_d80 is not in the flavor catalogue —
    #   fall back to the baseline's c4_r5_d80.
    flavor: c4_r8_d80
    base_box:
      # Verified against the working Windows 11 baseline
      # (github.com/andpara/cr-sandbox-baselines): image name and mgmt user are correct.
      image: windows-11-x86_64
      mgmt_user: windows
      # NO mgmt_protocol HERE — DO NOT ADD IT BACK.
      # Declaring `mgmt_protocol: winrm` is what broke the 2026-09-12 build: the VM was
      # created and got a management IP, but never brought up a WinRM HTTPS listener, so
      # the platform's own Windows reachability gate (networking-hosts.yml) timed out
      # after 1644s with a TCP ConnectTimeoutError on port 5986. The baseline omits the
      # key entirely and lets the platform derive the protocol from the image; its very
      # first fix commit (b5ce235) was to delete it. The key is harmless on Linux hosts —
      # the router below sets it and provisions fine — but Windows must not carry it.
    hidden: false
routers:
  - name: router
    flavor: standard.small
    base_box:
      image: ubuntu-noble-x86_64
      mgmt_user: ubuntu
      mgmt_protocol: ssh
    hidden: false
networks:
  - name: network-2
    cidr: 192.168.0.0/24
    accessible_by_user: true
    hidden: false
wan:
  name: network-1
  cidr: 10.10.10.0/24
net_mappings:
  - host: dfvm
    network: network-2
    ip: 192.168.0.10
router_mappings:
  - router: router
    network: network-2
    ip: 192.168.0.1
groups: []
