# DF-5 "Disk Forensics" — single Windows 11 analyst workstation.
# The whole module (DF-5.1–5.4) is performed on this one host using the LMS tools
# NATIVELY on Windows: Registry Explorer, RegRipper, FTK Imager, Autopsy.
# Pure offline analysis — no target host, no Docker.
name: btcmp-16-disk-forensics-main
hosts:
  - name: dfvm                        # analyst workstation (visible to trainee)
    # c{cpu}_r{ramGB}_d{diskGB}. Changed from c4_r8_d80 after the 2026-09-12 timeouts:
    # that RAM x disk combo is used by NEITHER working Windows repo and likely is not a
    # named flavor in the catalogue. c4_r8_d60 is the exact flavor of the proven full
    # Windows CR (github.com/Panagiotis-INS/BTCM-16-ADV, host wvvm), so r8 is known-good.
    # ⚠ RESIDUAL RISK: that lab ran win-server-2019; windows-11's first working baseline
    #   (cr-sandbox-baselines) needed d80. If the stack fails to CREATE (not the WinRM
    #   timeout — an OpenStack flavor/disk error), windows-11 needs d80 and the only proven
    #   windows-11 flavor is c4_r5_d80 (5 GB). That is then the fallback.
    flavor: c4_r8_d60
    base_box:
      # Verified against the working Windows 11 baseline
      # (github.com/andpara/cr-sandbox-baselines): image name and mgmt user are correct.
      image: windows-11-x86_64
      mgmt_user: windows
      # mgmt_protocol: winrm — REQUIRED. The platform injects the PSRP/WinRM-HTTPS
      # connection config (ansible_connection=psrp, cert_validation=ignore, port 5986)
      # for a host only when this is set. The full working Windows CR on this platform
      # (github.com/Panagiotis-INS/BTCM-16-ADV, host wvvm) sets it exactly like this.
      # (An earlier attempt removed this key on a wrong hypothesis; it did not fix the
      # timeout and is restored here.)
      mgmt_protocol: winrm
    hidden: false
routers:
  - name: router
    flavor: standard.small
    base_box:
      image: ubuntu-noble-x86_64
      mgmt_user: ubuntu
      mgmt_protocol: ssh
    hidden: false
networks:
  - name: network-2
    cidr: 192.168.0.0/24
    accessible_by_user: true
    hidden: false
wan:
  name: network-1
  cidr: 10.10.10.0/24
net_mappings:
  - host: dfvm
    network: network-2
    ip: 192.168.0.10
router_mappings:
  - router: router
    network: network-2
    ip: 192.168.0.1
groups: []
